<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gabriel & Cristina - Nuestra Boda</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      font-family:'Poppins',sans-serif;
      overflow:hidden;
      background:
        linear-gradient(rgba(255,240,245,0.75), rgba(255,240,245,0.75)),
        url('https://images.unsplash.com/photo-1520854221256-17451cc331bf?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
      display:flex;
      justify-content:center;
      align-items:center;
      color:#fff;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(
        180deg,
        rgba(0,0,0,0.25),
        rgba(0,0,0,0.45)
      );
    }

    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:950px;
      text-align:center;
      padding:50px 30px;
      border-radius:30px;
      backdrop-filter: blur(10px);
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.25);
      box-shadow:0 15px 40px rgba(0,0,0,0.3);
    }

    .hearts{
      position:absolute;
      width:100%;
      height:100%;
      inset:0;
      overflow:hidden;
      pointer-events:none;
    }

    .heart{
      position:absolute;
      color:rgba(255,255,255,0.6);
      animation:float 10s linear infinite;
      font-size:20px;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
      }
      20%{
        opacity:1;
      }
      100%{
        transform:translateY(-120px) scale(1.4);
        opacity:0;
      }
    }

    h1{
      font-family:'Great Vibes',cursive;
      font-size:5rem;
      margin-bottom:10px;
      text-shadow:0 4px 12px rgba(0,0,0,0.4);
    }

    .subtitle{
      font-size:1.3rem;
      margin-bottom:30px;
      font-weight:300;
      letter-spacing:2px;
    }

    .date{
      font-size:1.5rem;
      margin-bottom:40px;
      color:#ffe5ec;
      font-weight:600;
    }

    .countdown{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:20px;
      margin-top:20px;
    }

    .box{
      background:rgba(255,255,255,0.18);
      padding:25px 15px;
      border-radius:25px;
      border:1px solid rgba(255,255,255,0.2);
      transition:0.3s ease;
      box-shadow:0 8px 25px rgba(0,0,0,0.2);
    }

    .box:hover{
      transform:translateY(-8px) scale(1.03);
      background:rgba(255,255,255,0.25);
    }

    .number{
      font-size:3rem;
      font-weight:700;
      color:#fff;
    }

    .label{
      margin-top:8px;
      font-size:1rem;
      text-transform:uppercase;
      letter-spacing:2px;
      color:#ffeef3;
    }

    .message{
      margin-top:45px;
      font-size:1.2rem;
      line-height:1.8;
      color:#fff7fa;
      max-width:700px;
      margin-inline:auto;
    }

    .footer{
      margin-top:35px;
      font-family:'Great Vibes',cursive;
      font-size:2.5rem;
      color:#fff;
    }

    @media(max-width:768px){
      h1{
        font-size:3.5rem;
      }

      .subtitle{
        font-size:1rem;
      }

      .number{
        font-size:2.2rem;
      }

      .footer{
        font-size:2rem;
      }
    }
  </style>
</head>

<body>

  <div class="overlay"></div>

  <div class="hearts" id="hearts"></div>

  <div class="container">

    <h1>Gabriel & Cristina</h1>

    <p class="subtitle">
      El comienzo de nuestra historia para siempre ✨
    </p>

    <div class="date">
      17 de Octubre ❤️
    </div>

    <div class="countdown">

      <div class="box">
        <div class="number" id="days">0</div>
        <div class="label">Días</div>
      </div>

      <div class="box">
        <div class="number" id="hours">0</div>
        <div class="label">Horas</div>
      </div>

      <div class="box">
        <div class="number" id="minutes">0</div>
        <div class="label">Minutos</div>
      </div>

      <div class="box">
        <div class="number" id="seconds">0</div>
        <div class="label">Segundos</div>
      </div>

    </div>

    <div class="message">
      “Cada historia de amor es hermosa, pero la nuestra es nuestra favorita.”
      <br><br>
      Estamos contando cada segundo para vivir el día más especial de nuestras vidas.
    </div>

    <div class="footer">
      Nos vemos en el altar 💍
    </div>

  </div>

  <script>
    // Fecha de la boda
    const weddingDate = new Date("October 17, 2026 00:00:00").getTime();

    const updateCountdown = () => {

      const now = new Date().getTime();
      const distance = weddingDate - now;

      if(distance <= 0){
        document.querySelector(".countdown").innerHTML = `
          <div style="
            grid-column:1/-1;
            font-size:2rem;
            font-weight:bold;
            color:white;
          ">
            💖 ¡Hoy es el gran día! 💖
          </div>
        `;
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("minutes").innerText = minutes;
      document.getElementById("seconds").innerText = seconds;
    };

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Corazones flotando
    const heartsContainer = document.getElementById("hearts");

    function createHeart(){
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 15) + "px";
      heart.style.animationDuration = (Math.random() * 5 + 5) + "s";

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 10000);
    }

    setInterval(createHeart, 400);
  </script>

</body>
</html>
