<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Para ti, mi amor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at top, #0f172a, #020617);
      height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
    }

    .center-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 1rem 3rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 1.4rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, opacity 0.4s ease;
      z-index: 10;
    }

    .center-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="container">
    <canvas id="stars"></canvas>
    <button id="btn" class="center-btn">Presióname</button>
  </div>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    const btn = document.getElementById("btn");

    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    /* ⚡ OPTIMIZADO */
    const NUM_PARTICLES = 1800;

    const particles = [];
    let targets = [];
    let mode = "free";
    let formingStartTime = null;

    /* 💬 SECUENCIA */
    const sequence = [
      { type: "heart" },
      { text: "Ibeth y Agustín" },
      { text: "Eres el amor de mi vida" },
      { text: "Eres mi todo" },
      { text: "TE AMO", fireworks: true }
    ];

    const wordDuration = 2600;

    /* ⭐ partículas */
    function createParticles() {
      particles.length = 0;
      for (let i = 0; i < NUM_PARTICLES; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          size: Math.random() * 1 + 0.5,
          color: "#fff"
        });
      }
    }
    createParticles();

    /* fondo */
    function drawBackground() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, w, h);
    }

    /* movimiento libre */
    function updateFree() {
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h;
        if (p.y > h) p.y = 0;
      }
    }

    /* formar figura */
    function updateForm(progress) {
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const t = targets[i % targets.length];

        p.x += (t.x - p.x) * 0.08;
        p.y += (t.y - p.y) * 0.08;
        p.color = t.color;
      }
    }

    /* dibujar */
    function drawParticles() {
      for (const p of particles) {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* 💬 TEXTO CLARO */
    function generateText(text) {
      const off = document.createElement("canvas");
      const octx = off.getContext("2d");

      off.width = w;
      off.height = h;

      const size = Math.min(w * 0.1, 100);

      octx.fillStyle = "white";
      octx.textAlign = "center";
      octx.textBaseline = "middle";
      octx.font = `bold ${size}px Arial`;

      octx.fillText(text, w / 2, h / 2);

      const data = octx.getImageData(0, 0, w, h).data;
      const pts = [];

      for (let y = 0; y < h; y += 6) {
        for (let x = 0; x < w; x += 6) {
          const i = (y * w + x) * 4;
          if (data[i + 3] > 150) pts.push({ x, y });
        }
      }

      targets = pts.map(p => ({
        x: p.x,
        y: p.y,
        color: "#ff4d6d"
      }));
    }

    /* ❤️ corazón visible */
    function generateHeart() {
      const pts = [];

      for (let t = 0; t < Math.PI * 2; t += 0.02) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y =
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t);

        pts.push({
          x: w / 2 + x * 12,
          y: h / 2 - y * 12
        });
      }

      targets = pts.map(p => ({
        x: p.x,
        y: p.y,
        color: "#ff4d6d"
      }));
    }

    /* 🎆 explosión ligera */
    function explode() {
      for (const p of particles) {
        p.vx = (Math.random() - 0.5) * 3;
        p.vy = (Math.random() - 0.5) * 3;
        p.color = ["#ff4d6d", "#ffd166", "#fff"][Math.floor(Math.random() * 3)];
      }
    }

    /* animación */
    function animate(t) {
      ctx.clearRect(0, 0, w, h);
      drawBackground();

      if (mode === "free") updateFree();
      else {
        if (!formingStartTime) formingStartTime = t;
        const progress = (t - formingStartTime) / 1000;
        updateForm(progress);
      }

      drawParticles();
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    /* secuencia */
    function play() {
      let i = 0;

      function next() {
        if (i >= sequence.length) return;

        const step = sequence[i];

        if (step.type === "heart") generateHeart();
        else generateText(step.text);

        mode = "forming";
        formingStartTime = null;

        if (step.fireworks) {
          setTimeout(() => explode(), 1200);
        }

        setTimeout(() => {
          mode = "free";
          i++;
          setTimeout(next, 400);
        }, wordDuration);
      }

      next();
    }

    btn.addEventListener("click", () => {
      btn.style.display = "none";
      play();
    });
  </script>
</body>

</html>
